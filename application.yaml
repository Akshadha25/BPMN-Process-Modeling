# Mounted into the orchestration container (same settings as the official 8.8 compose).
management.endpoints.configprops.show-values: always
camunda:
  system:
    cpu-thread-count: "3"
    io-thread-count: "3"
  security:
    authentication:
      method: "basic"
      unprotectedApi: true          # local dev: the Spring Boot backend needs no credentials
    authorizations:
      enabled: false
    initialization:
      users:
        - username: "demo"          # login for Operate / Tasklist in the browser
          password: "demo"
          name: "Demo User"
          email: "demo@demo.com"
      defaultRoles.admin.users:
        - "demo"
  database.index.numberOfReplicas: 0   # single-node Elasticsearch
  data:
    secondary-storage:
      type: elasticsearch
      elasticsearch:
        cluster-name: elasticsearch
        url: "http://elasticsearch:9200"

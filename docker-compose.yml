# Camunda 8 Self-Managed (Zeebe + Operate + Tasklist in one "orchestration" container) + Elasticsearch.
# Adapted from the official camunda-distributions docker-compose/versions/camunda-8.8 (lightweight):
#   - UI/REST published on 8080 (official file uses 8088) so every URL in the guides works
#   - Connectors removed (not used by the leave process)
#   - data kept in ./data (see project structure)
# For local development only - not a production setup.
services:
  orchestration:
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: orchestration
    ports:
      - "8080:8080"     # Operate, Tasklist, REST API (/v2)
      - "26500:26500"   # gRPC
      - "9600:9600"     # management / health
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 30s
    volumes:
      - ./data/zeebe:/usr/local/camunda/data
      - ./config/application.yaml:/usr/local/camunda/config/application.yaml:ro
    networks:
      - camunda
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - logger.org.elasticsearch.deprecation="OFF"
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cat/health | grep -q green" ]
      interval: 1s
      retries: 30
      start_period: 30s
      timeout: 1s
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    networks:
      - camunda

networks:
  camunda:
    name: camunda

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS; resolving at request time lets nginx start before the backend is ready
  resolver 127.0.0.11 valid=10s;

  # same /api paths as the Vite dev proxy: forward to the Spring Boot container
  location /api/ {
    set $backend http://backend:8081;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
